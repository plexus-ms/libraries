name: verify

# Mounts the verify verb on every pull request (§ 2 PLX-Delivery): is the
# repo sound? Managed by copier: edit the preset (plexus-ms/preset-repo-web),
# never this file.
#
# A package repo's trunk admits nothing but pull requests, so this runs on
# every pull request, tested as the merge result; a push trigger would never
# fire for the "version packages" PR, whose branch the release job pushes with
# the workflow token. Plus the changeset guard: a publishable change ships
# with a changeset, or an empty one that records a no-release change
# (`changeset add --empty`); the update bot's branches get theirs written by
# `plx changeset` instead.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# Where the jobs run (repo variables): CI_RUNNER is the runner label, unset
# for GitHub's runners; CI_RUNNER_PERSISTENT is `true` when that runner keeps
# its disk between jobs, so caches stay local. Unset both to be back on
# GitHub's runners with the next push.
#
# Turbo's remote cache (§ 8 PLX-Delivery), off until TURBO_CACHE_BUCKET is
# set: the repo variables TURBO_CACHE_ENDPOINT, TURBO_CACHE_REGION and
# TURBO_CACHE_BUCKET name an S3 bucket of the tenant's own, the repo secrets
# TURBO_CACHE_ACCESS_KEY and TURBO_CACHE_SECRET_KEY grant read and write on it.
jobs:
  verify:
    uses: plexus-ms/primitives/.github/workflows/_verify.yml@0.104.0
    with:
      runner: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
      persistent: ${{ vars.CI_RUNNER_PERSISTENT == 'true' }}
      turbo-cache-endpoint: ${{ vars.TURBO_CACHE_ENDPOINT || '' }}
      turbo-cache-region: ${{ vars.TURBO_CACHE_REGION || '' }}
      turbo-cache-bucket: ${{ vars.TURBO_CACHE_BUCKET || '' }}
    secrets:
      turbo-cache-access-key: ${{ secrets.TURBO_CACHE_ACCESS_KEY }}
      turbo-cache-secret-key: ${{ secrets.TURBO_CACHE_SECRET_KEY }}

  changeset-status:
    # The Version Packages branch is *built by* `changeset version`, which
    # consumes the changeset files it releases — there "changed packages, no
    # changesets" is the expected state. The update bot's branches are exempt
    # because the guard counts any file under a package directory: a
    # devDependency bump trips it and owes no release; the changeset job below
    # writes the one a runtime bump owes.
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') && !startsWith(github.head_ref, 'renovate/') }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec changeset status --since=origin/main

  changeset:
    # The update bot writes no changesets: the verb writes the one its bump
    # owes and commits it to the bot's branch, pushed with a token minted for
    # the tenant's own GitHub App (contents write on this repo; repo variable
    # PLX_APP_ID, secret PLX_APP_PRIVATE_KEY) so that the new tip
    # runs this workflow; a push with the workflow token starts no run.
    if: ${{ startsWith(github.head_ref, 'renovate/') }}
    uses: plexus-ms/primitives/.github/workflows/_changeset.yml@0.104.0
    permissions:
      contents: write
    with:
      app_id: ${{ vars.PLX_APP_ID }}
      runner: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
      persistent: ${{ vars.CI_RUNNER_PERSISTENT == 'true' }}
    secrets:
      app_private_key: ${{ secrets.PLX_APP_PRIVATE_KEY }}


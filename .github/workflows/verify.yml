name: verify

# Mounts the verify verb on every push (§ 2 PLX-Delivery), plus the changeset
# guard: a publishable change ships with a changeset, or an empty one that
# records a no-release change (`changeset add --empty`).

on:
  push:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: plexus-ms/ci-cd/.github/workflows/_verify.yml@0.64.0

  changeset-status:
    # The Version Packages branch is *built by* `changeset version`, which
    # consumes the changeset files it releases — there "changed packages, no
    # changesets" is the expected state. On main itself there is nothing
    # since main. The update bot writes no changesets, so its branches are
    # exempt: a bump that changes what a published package ships is given its
    # changeset by the human who merges it.
    if: ${{ !startsWith(github.ref_name, 'changeset-release/') && !startsWith(github.ref_name, 'renovate/') && github.ref_name != 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec changeset status --since=origin/main

name: on_push

# Generated from plexus-ms/template-repo-turbo: edit the template, never this file.
# A package repo's trunk mount, check then publish; started by hand on a branch, snapshot versions of it (§ 5 PLX-Delivery).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      snapshot:
        description: The dist-tag the snapshot versions are published under, as in my-change
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  check:
    uses: plexus-ms/tooling/.github/workflows/_check.yml@0.128.0
    with:
      strategy: ${{ vars.CI_STRATEGY || 'github' }}
      tasks: verify

  publish:
    needs: check
    uses: plexus-ms/tooling/.github/workflows/_publish-package.yml@0.128.0
    with:
      strategy: ${{ vars.CI_STRATEGY || 'github' }}
      registry: npm
      snapshot: ${{ inputs.snapshot }}

name: release

# Mounts verify and release on a push to the trunk (§§ 2 and 5 PLX-Delivery):
# verify first, then changesets versions and publishes, token-less through
# OIDC trusted publishing with provenance. Managed by copier: edit the preset
# (plexus-ms/preset-repo-web), never this file.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

# Where the jobs run: see verify.yml.
jobs:
  verify:
    uses: plexus-ms/primitives/.github/workflows/_verify.yml@0.104.0
    with:
      runner: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
      persistent: ${{ vars.CI_RUNNER_PERSISTENT == 'true' }}
      turbo-cache-endpoint: ${{ vars.TURBO_CACHE_ENDPOINT || '' }}
      turbo-cache-region: ${{ vars.TURBO_CACHE_REGION || '' }}
      turbo-cache-bucket: ${{ vars.TURBO_CACHE_BUCKET || '' }}
    secrets:
      turbo-cache-access-key: ${{ secrets.TURBO_CACHE_ACCESS_KEY }}
      turbo-cache-secret-key: ${{ secrets.TURBO_CACHE_SECRET_KEY }}

  release:
    needs: verify
    uses: plexus-ms/primitives/.github/workflows/_release-package.yml@0.104.0
    with:
      runner: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
      persistent: ${{ vars.CI_RUNNER_PERSISTENT == 'true' }}

name: release

# Mounts verify and release on a push to the trunk (§§ 2 and 5 PLX-Delivery):
# verify first, then changesets versions and publishes, token-less through
# OIDC trusted publishing with provenance.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  verify:
    uses: plexus-ms/ci-cd/.github/workflows/_verify.yml@0.70.1

  release:
    needs: verify
    uses: plexus-ms/ci-cd/.github/workflows/_release-package.yml@0.70.1

monorepo_root = true

[monorepo]
config_roots = ["packages/*"]

[tools]
node = "24"
hk = "latest"
python = "3.14"
uv = "latest"
copier = { version = "latest", uvx = true }
# The plx pins are written with each Plexus version, never by the update bot (§ 1 PLX-Updates);
# allow_low_downloads only waives npm's young-package heuristics.
"npm:@plexus-ms/cli" = { version = "0.128.0", allow_low_downloads = true }

[settings]
# Not a version source: it lets config_roots match a project without a mise config of its own,
# without which `mise install --monorepo` fails in a repo whose roots are only packages.
idiomatic_version_file_enable_tools = ["node"]

[hooks]
# hk is absent on a CI runner whose mise installs only the tools a job names.
postinstall = "if command -v hk >/dev/null; then hk install --mise; fi && npx corepack enable"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.dev]
description = "No-op: a package repo has no development environment to start; build builds its packages and test exercises them"
usage = 'arg "[name]" hide=#true'
run = 'echo "dev: nothing to start in a package repo"'

[tasks.build]
depends = ["install"]
description = "Build the packages, each after the workspace packages it depends on"
usage = 'arg "[name]" help="Package to build, by its directory name under packages/ (e.g. my-package, defaults to all)"'
run = '''
dir=
if [ -n "${usage_name:-}" ]; then
  case $usage_name in
    */* | . | ..) echo "build: $usage_name is not a directory name under packages/" >&2; exit 1 ;;
  esac
  [ ! -f "packages/$usage_name/package.json" ] || dir=packages/$usage_name
  [ -n "$dir" ] || { echo "build: no package $usage_name under packages/" >&2; exit 1; }
fi
turbo run build ${dir:+--filter="{./$dir}..."}
'''

[tasks.verify]
description = "Perform all steps that verify code quality"
usage = 'arg "[name]" help="Package to verify, by its directory name under packages/ (e.g. my-package, defaults to all)"'
run = [
    'mise run check ${usage_name:+"$usage_name"}',
    'mise run test ${usage_name:+"$usage_name"}',
]

[tasks.install]
description = "Install and wire up project dependencies"
hide = true
run = "pnpm install"
sources = ["package.json", "packages/*/package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml"]
outputs = ["node_modules/.pnpm/lock.yaml"]

[tasks.lint]
depends = ["install"]
description = "Lint and format the codebase"
usage = '''
flag "--write" help="Apply safe fixes and formatting in place"
arg "<paths>" var=#true default="." help="Files or directories to lint (defaults to the whole repo)"
'''
# usage shell-quotes var-arg values, so re-parse them via eval instead of bare expansion.
run = 'eval "set -- $usage_paths"; biome check ${usage_write:+--write} --no-errors-on-unmatched "$@"'

[tasks.check]
depends = ["install"]
description = "Run static checks on the codebase: lint and the contracts' checks (plx doctor), repo-wide, then each project's check script"
usage = 'arg "[name]" help="Package to check, by its directory name under packages/ (e.g. my-package, defaults to all)"'
run = '''
dir=
if [ -n "${usage_name:-}" ]; then
  case $usage_name in
    */* | . | ..) echo "check: $usage_name is not a directory name under packages/" >&2; exit 1 ;;
  esac
  [ ! -f "packages/$usage_name/package.json" ] || dir=packages/$usage_name
  [ -n "$dir" ] || { echo "check: no package $usage_name under packages/" >&2; exit 1; }
fi
mise run lint
plx doctor
turbo run check ${dir:+--filter="{./$dir}..."}
'''

[tasks.test]
depends = ["install"]
description = "Run tests on the codebase"
usage = 'arg "[name]" help="Package to test, by its directory name under packages/ (e.g. my-package, defaults to all)"'
run = '''
dir=
if [ -n "${usage_name:-}" ]; then
  case $usage_name in
    */* | . | ..) echo "test: $usage_name is not a directory name under packages/" >&2; exit 1 ;;
  esac
  [ ! -f "packages/$usage_name/package.json" ] || dir=packages/$usage_name
  [ -n "$dir" ] || { echo "test: no package $usage_name under packages/" >&2; exit 1; }
fi
turbo run test ${dir:+--filter="{./$dir}..."}
'''
